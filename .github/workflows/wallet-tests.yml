name: Wallet foundation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/wallet-v1-foundation"]

jobs:
  wallet-postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nene
          POSTGRES_PASSWORD: nene_test_only
          POSTGRES_DB: nene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nene -d nene_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nene:nene_test_only@localhost:5432/nene_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile backend modules
        run: python -m compileall -q app.py auth.py database.py pricing.py rate_limits.py readiness.py wallet.py wallet_store.py projects.py project_store.py characters.py character_store.py generation_store.py generation_outbox.py generation_service.py generation_worker.py media_storage.py scripts/media_storage_smoke_test.py
      - name: Run wallet PostgreSQL integration tests
        run: PYTHONPATH=. pytest -q tests/test_auth.py tests/test_media_url_security.py tests/test_media_storage.py tests/test_generation_media_delivery.py tests/test_rate_limits.py tests/test_wallet_api_boundary.py tests/test_wallet_store.py tests/test_production_environment.py tests/test_production_generation_guards.py tests/test_readiness.py tests/test_project_ownership.py tests/test_character_ownership.py tests/test_generation_store_unit.py tests/test_generation_polling.py tests/test_pricing.py tests/test_generation_outbox_unit.py tests/test_generation_outbox_postgres.py tests/test_generation_service_postgres.py tests/test_generation_worker_unit.py
