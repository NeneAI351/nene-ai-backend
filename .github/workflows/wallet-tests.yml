name: Wallet foundation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/wallet-v1-foundation"]

jobs:
  wallet-postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nene
          POSTGRES_PASSWORD: nene_test_only
          POSTGRES_DB: nene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nene -d nene_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nene:nene_test_only@localhost:5432/nene_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile backend modules
        run: python -m compileall -q app.py auth.py database.py pricing.py rate_limits.py wallet.py wallet_store.py
      - name: Run wallet PostgreSQL integration tests
        run: PYTHONPATH=. pytest -q tests/test_auth.py tests/test_media_url_security.py tests/test_rate_limits.py tests/test_wallet_store.py
