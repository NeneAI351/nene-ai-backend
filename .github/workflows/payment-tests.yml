name: Payment foundation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/paystack-test-checkout"]

jobs:
  payment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile payment module and app
        run: python -m compileall -q payments.py app.py pricing.py provider_costs.py generation_worker.py
      - name: Run payment safety tests
        run: PYTHONPATH=. pytest -q tests/test_payments.py tests/test_pricing.py tests/test_provider_costs.py
