name: Payment foundation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/paystack-test-checkout", "feature/owner-earnings-dashboard"]

jobs:
  payment-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nene_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nene_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile payment module and app
        run: python -m compileall -q payments.py admin_finance.py app.py pricing.py provider_costs.py generation_worker.py
      - name: Run payment and worker safety tests
        run: PYTHONPATH=. pytest -q tests/test_payments.py tests/test_admin_finance.py tests/test_pricing.py tests/test_provider_costs.py tests/test_generation_worker_unit.py tests/test_media_storage.py
      - name: Run real PostgreSQL payment and provider-cost integration tests
        run: PYTHONPATH=. pytest -q tests/test_payments_postgres.py tests/test_provider_costs_postgres.py
